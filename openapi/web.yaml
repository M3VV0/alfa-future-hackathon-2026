          },
          "404": {
            "description": "Объект не найден или недоступен"
          },
          "409": {
            "description": "Конфликт version / command_id / состояния"
          },
          "422": {
            "description": "Ошибки полей, text/html"
          },
          "503": {
            "description": "Временная техническая ошибка, text/html + X-Trace-Id"
          },
          "501": {
            "description": "Frontend отложен; данные уже загружены в MVC model",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "200": {
            "description": "Содержимое файла или системная страница"
