spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: assessment
  datasource:
    url: ${ASSESSMENT_JDBC_URL:jdbc:postgresql://localhost:5432/credit}
    username: ${ASSESSMENT_DB_USER:assessment}
    password: ${ASSESSMENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/assessment
    default-schema: assessment
    schemas: assessment
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
jobs:
  schema: assessment
security:
  service-token: ${SERVICE_TOKEN}
integrations:
  credit-url: ${CREDIT_URL:http://localhost:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash
