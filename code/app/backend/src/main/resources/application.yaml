spring:
  application:
    name: smartcreditor-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartcreditor}
    username: ${DB_USER:smartcreditor}
    password: ${DB_PASSWORD:localdev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080
