spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  application:
    name: smartcreditor-backend

  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartcreditor}
    username: ${DB_USER:smartcreditor}
    password: ${DB_PASSWORD:localdev}

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate.globally_quoted_identifiers: true
    open-in-view: false

  flyway:
    enabled: true
    validate-migration-naming: true

server:
  port: 8080

credit:
  application:
    worker:
      enabled: ${SCORER_ENABLED:false}
      poll-delay-ms: ${SCORER_POLL_DELAY_MS:1000}
      initial-delay-ms: ${SCORER_INITIAL_DELAY_MS:1000}

scorer:
  base-url: ${SCORER_BASE_URL:http://localhost:8000}
  token: ${SCORER_TOKEN:}
  connect-timeout: ${SCORER_CONNECT_TIMEOUT:PT3S}
  read-timeout: ${SCORER_READ_TIMEOUT:PT10S}
  request-lease: ${SCORER_REQUEST_LEASE:PT30S}
  callback-timeout: ${SCORER_CALLBACK_TIMEOUT:PT60S}
  retry-delay: ${SCORER_RETRY_DELAY:PT5S}
  max-attempts: ${SCORER_MAX_ATTEMPTS:5}

app:
  ui:
    default-locale: ru

security:
  auth:
    secure-cookies: ${AUTH_COOKIE_SECURE:true}
  jwt:
    issuer: smartcreditor
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
