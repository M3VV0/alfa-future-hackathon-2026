<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title th:text="#{application.title}"></title>
    <link rel="stylesheet" th:href="@{/assets/cabinet.css}" href="/assets/cabinet.css">
    <script th:src="@{/assets/application.js}" src="/assets/application.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main" th:text="#{application.skip}"></a>
<div class="cabinet-shell">
    <aside class="sidebar">
        <a class="brand" th:href="@{/app}" href="/app">
            <span class="brand-mark" aria-hidden="true">а<span></span></span>
            <span><span th:text="#{brand.name}"></span><span class="brand-caption" th:text="#{brand.caption}"></span></span>
        </a>
        <div class="sidebar-label" th:text="#{application.sidebar}"></div>
        <nav th:attr="aria-label=#{application.navigation}">
            <a class="nav-item active" th:href="@{/app}" href="/app" aria-current="page">
                <span class="nav-icon" aria-hidden="true">↗</span> <span th:text="#{application.heading}"></span>
            </a>
        </nav>
        <div class="sidebar-bottom">
            <p><span th:text="#{application.sidebarNote.first}"></span><br><strong th:text="#{application.sidebarNote.second}"></strong></p>
            <form id="logout-form" th:action="@{/logout}" action="/logout" method="post">
                <button class="logout-button" type="submit"><span aria-hidden="true">↪</span> <span th:text="#{application.logout}"></span></button>
            </form>
        </div>
    </aside>

    <div class="cabinet-main">
        <header class="topbar"><span th:text="#{application.financing}"></span><span class="topbar-label" th:text="#{application.portal}"></span></header>
        <main id="main" class="page-content">
            <div class="page-toolbar">
                <div class="breadcrumbs"><span th:text="#{application.cabinet}"></span><span aria-hidden="true">/</span><span th:text="#{application.new}"></span></div>
                <nav class="locale-switcher" th:attr="aria-label=#{language.label}">
                    <a th:href="@{/app(lang='ru')}" lang="ru" hreflang="ru"
                       th:attr="aria-current=${#locale.language == 'ru' ? 'true' : null}">RU</a>
                    <a th:href="@{/app(lang='en')}" lang="en" hreflang="en"
                       th:attr="aria-current=${#locale.language == 'en' ? 'true' : null}">EN</a>
                </nav>
            </div>
            <div class="page-heading">
                <div><span class="eyebrow" th:text="#{application.eyebrow}"></span><h1 th:text="#{application.heading}"></h1>
                    <p class="muted" th:text="#{application.description}"></p></div>
                <span class="status-badge"><span class="red-dot"></span> <span th:text="#{application.new}"></span></span>
            </div>

            <noscript><div class="message message-error" th:text="#{application.javascriptRequired}"></div></noscript>
            <div id="submission-error" class="message message-error" role="alert" tabindex="-1" hidden>
                <p id="submission-error-text"></p>
                <a id="login-again" th:href="@{/login}" href="/login" hidden th:text="#{login.submit}"></a>
            </div>

            <div id="application-workspace" class="application-workspace">
                <form id="application-form" class="application-card" th:action="@{/api/credit/application/submit}"
                      action="/api/credit/application/submit" method="post"
                      th:attr="data-refresh-url=@{/auth/refresh},data-login-url=@{/login},data-csrf-url=@{/auth/csrf},
                               data-months-unit=#{unit.months},
                               data-session-expired=#{error.sessionExpired},
                               data-forbidden=#{error.forbidden},
                               data-business-unavailable=#{error.businessUnavailable},
                               data-business-not-found=#{error.businessNotFound},
                               data-invalid-request=#{error.invalidRequest},
                               data-unconfirmed=#{error.unconfirmed},
                               data-network-error=#{error.network},
                               data-logout-error=#{error.logout}">
                    <section class="form-section" aria-labelledby="business-title">
                        <div class="section-heading"><span class="section-index">01</span><div><h2 id="business-title" th:text="#{application.company}"></h2>
                            <p th:text="#{application.companyDescription}"></p></div></div>
                        <div class="field">
                            <label for="businessId" th:text="#{application.businessId}"></label>
                            <input id="businessId" name="businessId" type="text" required spellcheck="false" autocomplete="off"
                                   placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" maxlength="36"
                                   pattern="[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
                                   aria-describedby="business-hint businessId-error" th:attr="data-invalid-message=#{validation.businessId}">
                            <span id="business-hint" class="field-hint" th:text="#{application.businessHint}"></span>
                            <span id="businessId-error" class="field-error" hidden></span>
                        </div>
                    </section>
                    <section class="form-section" aria-labelledby="parameters-title">
                        <div class="section-heading"><span class="section-index">02</span><div><h2 id="parameters-title" th:text="#{application.parameters}"></h2>
                            <p th:text="#{application.parametersDescription}"></p></div></div>
                        <div class="form-grid">
                            <div class="field">
                                <label for="requestedAmount" th:text="#{application.amount}"></label>
                                <div class="input-with-unit"><input id="requestedAmount" name="requestedAmount" type="text"
                                    inputmode="decimal" required placeholder="1 000 000" autocomplete="off"
                                    aria-describedby="requestedAmount-error"
                                    th:attr="data-invalid-message=#{validation.amount},data-positive-message=#{validation.positiveAmount}"><span aria-hidden="true">₽</span></div>
                                <span id="requestedAmount-error" class="field-error" hidden></span>
                            </div>
                            <div class="field">
                                <label for="termMonths" th:text="#{application.term}"></label>
                                <input id="termMonths" name="termMonths" type="number" inputmode="numeric" min="1" max="2147483647"
                                       step="1" required placeholder="24" aria-describedby="termMonths-error" th:attr="data-invalid-message=#{validation.term}">
                                <span id="termMonths-error" class="field-error" hidden></span>
                            </div>
                            <div class="field field-wide">
                                <label for="financingPurpose" th:text="#{application.purpose}"></label>
                                <select id="financingPurpose" name="financingPurpose" required aria-describedby="financingPurpose-error" th:attr="data-invalid-message=#{validation.purpose}">
                                    <option value="" disabled selected th:text="#{application.choosePurpose}"></option>
                                    <option value="WORKING_CAPITAL" th:text="#{purpose.workingCapital}"></option>
                                    <option value="EQUIPMENT" th:text="#{purpose.equipment}"></option>
                                    <option value="INVESTMENT" th:text="#{purpose.investment}"></option>
                                    <option value="REFINANCING" th:text="#{purpose.refinancing}"></option>
                                    <option value="BUSINESS_AUTO" th:text="#{purpose.businessAuto}"></option>
                                    <option value="COMMERCIAL_MORTGAGE" th:text="#{purpose.commercialMortgage}"></option>
                                </select>
                                <span id="financingPurpose-error" class="field-error" hidden></span>
                            </div>
                            <fieldset class="frequency-field field-wide">
                                <legend th:text="#{application.frequency}"></legend>
                                <div class="radio-options">
                                    <label class="radio-option"><input type="radio" name="paymentFrequency" value="MONTHLY" checked required><span th:text="#{frequency.monthly}"></span></label>
                                    <label class="radio-option"><input type="radio" name="paymentFrequency" value="QUARTERLY"><span th:text="#{frequency.quarterly}"></span></label>
                                </div>
                            </fieldset>
                        </div>
                    </section>
                    <section class="form-section" aria-labelledby="collateral-title">
                        <div class="section-heading"><span class="section-index">03</span><div><h2 id="collateral-title"><span th:text="#{application.collateral}"></span> <span class="optional" th:text="#{application.optional}"></span></h2>
                            <p th:text="#{application.collateralDescription}"></p></div></div>
                        <div class="field collateral-field">
                            <label for="declaredCollateralValue" th:text="#{application.collateralValue}"></label>
                            <div class="input-with-unit"><input id="declaredCollateralValue" name="declaredCollateralValue" type="text"
                                inputmode="decimal" th:placeholder="#{summary.emptyCollateral}" autocomplete="off"
                                aria-describedby="collateral-hint declaredCollateralValue-error" th:attr="data-invalid-message=#{validation.amount}"><span aria-hidden="true">₽</span></div>
                            <span id="collateral-hint" class="field-hint" th:text="#{application.collateralHint}"></span>
                            <span id="declaredCollateralValue-error" class="field-error" hidden></span>
                        </div>
                    </section>
                    <div class="form-footer"><span class="field-hint" th:text="#{application.check}"></span>
                        <button id="submit-button" class="button button-primary" type="submit" disabled
                                th:attr="data-submitting-label=#{application.submitting}">
                            <span id="submit-label" th:text="#{application.submit}"></span><span aria-hidden="true">↗</span>
                        </button>
                    </div>
                </form>

                <aside class="summary-card" aria-labelledby="summary-title">
                    <span class="section-number" th:text="#{summary.heading}"></span><h2 id="summary-title" th:text="#{summary.tagline}"></h2>
                    <div class="summary-amount"><span th:text="#{summary.amount}"></span><strong id="summary-amount" th:text="#{summary.emptyAmount}"></strong></div>
                    <dl class="summary-list">
                        <div><dt th:text="#{summary.term}"></dt><dd id="summary-term" th:text="#{summary.emptyTerm}"></dd></div>
                        <div><dt th:text="#{summary.frequency}"></dt><dd id="summary-frequency" th:text="#{frequency.monthly}"></dd></div>
                        <div class="summary-purpose"><dt th:text="#{summary.purpose}"></dt><dd id="summary-purpose" th:text="#{summary.emptyPurpose}"></dd></div>
                        <div><dt th:text="#{summary.collateral}"></dt><dd id="summary-collateral" th:text="#{summary.emptyCollateral}"></dd></div>
                    </dl>
                    <div class="summary-note"><span aria-hidden="true">↗</span><p><span th:text="#{summary.note.first}"></span><br><span th:text="#{summary.note.second}"></span></p></div>
                </aside>
            </div>

            <section id="submission-success" class="success-card" aria-labelledby="success-title" hidden>
                <span class="success-icon" aria-hidden="true">✓</span>
                <span class="eyebrow" th:text="#{success.saved}"></span><h2 id="success-title" tabindex="-1" th:text="#{success.accepted}"></h2>
                <p class="muted" th:text="#{success.description}"></p>
                <div class="receipt"><span th:text="#{success.id}"></span><strong id="application-id"></strong></div>
                <p class="field-hint" th:text="#{success.hint}"></p>
                <button id="new-application" class="button button-secondary" type="button"><span th:text="#{success.new}"></span> <span aria-hidden="true">↗</span></button>
            </section>
            <footer class="page-footer"><span th:text="#{brand.footer}"></span><span th:text="#{application.footer}"></span></footer>
        </main>
    </div>
</div>
</body>
</html>
