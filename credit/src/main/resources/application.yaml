spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: credit
  datasource:
    url: ${CREDIT_JDBC_URL:jdbc:postgresql://localhost:5432/credit}
    username: ${CREDIT_DB_USER:credit}
    password: ${CREDIT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
  flyway:
    locations: classpath:db/core
    default-schema: core
    schemas: core,auth
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: auth.SPRING_SESSION
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
jobs:
  schema: core
security:
  service-token: ${SERVICE_TOKEN}
  cookie-secure: ${COOKIE_SECURE:false}
storage:
  endpoint: ${S3_ENDPOINT:http://localhost:3900}
  bucket: ${S3_BUCKET:credit-documents}
  region: ${S3_REGION:garage}
  path-style: ${S3_PATH_STYLE:true}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
integrations:
  mocks-url: ${MOCKS_URL:http://localhost:8082}
  assessment-url: ${ASSESSMENT_URL:http://localhost:8081}
scoring:
  provider: ${SCORING_PROVIDER:rules}
  model-version: stub_reject_v1
seed:
  enabled: ${SEED_ENABLED:false}
  password: ${DEMO_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash
springdoc:
  swagger-ui:
    urls:
      - name: Web cabinet
        url: /openapi/web.yaml
      - name: Internal
        url: /openapi/internal.yaml
