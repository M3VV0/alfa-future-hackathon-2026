name: alfa-credit
x-credit-env: &credit-env
  CREDIT_JDBC_URL: jdbc:postgresql://postgres:5432/credit
  CREDIT_DB_PASSWORD: ${CREDIT_DB_PASSWORD:?copy .env.example to .env}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?required}
  S3_ENDPOINT: http://garage:3900
  S3_BUCKET: ${S3_BUCKET:-credit-documents}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
  ASSESSMENT_URL: http://assessment-app:8081
  MOCKS_URL: http://mocks:8080
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DEMO_PASSWORD: ${DEMO_PASSWORD:?required}
x-assessment-env: &assessment-env
  ASSESSMENT_JDBC_URL: jdbc:postgresql://postgres:5432/credit
  ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:?required}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?required}
  CREDIT_URL: http://credit-app:8080
x-java-health: &java-health
  test: [CMD, /app/healthcheck]
  interval: 10s
  timeout: 3s
  start_period: 60s
  retries: 12
services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: credit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      CREDIT_DB_PASSWORD: ${CREDIT_DB_PASSWORD:?required}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:?required}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d credit]
      interval: 3s
      timeout: 3s
      retries: 20
  garage:
    image: dxflrs/garage:v2.1.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?required}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
  garage-init:
    build: infra/garage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:-credit-documents}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta:ro
    depends_on: [garage]
  mocks:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./fixtures:/home/wiremock:ro
  credit-app:
    build:
      context: .
      target: credit
    image: alfa-credit:local
    environment:
      <<: *credit-env
      SERVER_PORT: 8080
      SEED_ENABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
      garage-init: {condition: service_completed_successfully}
      mocks: {condition: service_started}
    healthcheck: *java-health
  credit-worker:
    image: alfa-credit:local
    environment:
      <<: *credit-env
      SPRING_PROFILES_ACTIVE: worker
      SERVER_PORT: 8080
      SEED_ENABLED: "false"
    depends_on:
      credit-app: {condition: service_healthy}
      assessment-app: {condition: service_healthy}
    healthcheck: *java-health
  assessment-app:
    build:
      context: .
      target: assessment
    image: alfa-assessment:local
    environment:
      <<: *assessment-env
      SERVER_PORT: 8081
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: *java-health
  assessment-worker:
    image: alfa-assessment:local
    environment:
      <<: *assessment-env
      SPRING_PROFILES_ACTIVE: worker
      SERVER_PORT: 8081
    depends_on:
      assessment-app: {condition: service_healthy}
      credit-app: {condition: service_healthy}
    healthcheck: *java-health
  gateway:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      credit-app: {condition: service_healthy}
volumes:
  pg-data:
  garage-meta:
  garage-data:
