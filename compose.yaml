services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: smartcreditor
      POSTGRES_USER: smartcreditor
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  app:
    profiles: [app]
    build: ./code/app/backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/smartcreditor
      DB_USER: smartcreditor
      DB_PASSWORD: localdev
      SCORER_ENABLED: ${SCORER_ENABLED:-true}
      SCORER_BASE_URL: ${SCORER_BASE_URL:-http://scorer:8000}
      SCORER_TOKEN: ${SCORER_TOKEN:-local-review-scorer-token}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      scorer:
        condition: service_healthy
    restart: unless-stopped

  scorer:
    profiles: [app, scoring]
    build: ./code/scorer
    environment:
      SCORER_DATABASE_URL: postgresql+asyncpg://smartcreditor:localdev@postgres:5432/smartcreditor
      SCORER_TOKEN: ${SCORER_TOKEN:-local-review-scorer-token}
      JAVA_BASE_URL: ${JAVA_BASE_URL:-http://app:8080}
    ports:
      - "127.0.0.1:${SCORER_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
